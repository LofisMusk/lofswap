# Standalone crate: it is built with the Solana toolchain
# (`cargo build-sbf`), not with the node workspace.
[workspace]

[package]
name = "lofswap-htlc-solana"
version = "1.0.0"
edition = "2021"
description = "Hashed timelock escrow for the Solana leg of a LofSwap cross-chain swap"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.1"
solana-system-interface = { version = "1", features = ["bincode"] }
solana-sdk-ids = "2"

[dev-dependencies]
solana-program = "2.1"
# Integration tests run the compiled SBF program in the real Solana runtime.
# `LiteSVM` is the agave SVM with the SPL token program preloaded, so a test
# executes the same bytecode `cargo build-sbf` deploys.
litesvm = "0.16"
# `solana-keypair` uses `five8_core`'s `std::error::Error` impl, which is behind
# a feature the older `five8` in solana-program 2.x's tree leaves off. Only the
# host test build sees this; `cargo build-sbf` does not compile dev-dependencies.
five8_core = { version = "0.1", features = ["std"] }
solana-account = "4"
solana-address = "2.6.1"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-program-option = "3"
solana-program-pack = "3"
solana-signer = "3"
solana-transaction = "4"
spl-token-interface = "3"

[features]
default = []
# Set when building the on-chain artefact with `cargo build-sbf`.
no-entrypoint = []
# Declared for the `entrypoint!` macro; the program uses the default heap and
# panic handler.
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
