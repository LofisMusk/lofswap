[package]
name = "wallet-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
blockchain-core = { path = "../blockchain-core" }
chrono = "0.4"
eframe = "0.36"
egui = "0.36"
hex = "0.4"
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    # Linux: the Secret Service over D-Bus, with libdbus and the crypto built
    # from source so a release binary does not depend on the host's -dev packages.
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9.1"
rfd = "0.15.4"
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
